[package]
name = "genote"
version = "0.4.1"
edition = "2021"
description = "CLI tool that reads your existing .md notes as style examples and generates new notes on any topic using local LLMs and cloud APIs"
license = "MIT"
repository = "https://github.com/xmb03/Genote"
readme = "README.md"
keywords = ["ollama", "notes", "study", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["config.toml", "*.un~", "assets/*", "*.nix", ".*"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
urlencoding = "2"
keyring = "3"
rpassword = "7"
