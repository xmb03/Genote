name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build binary
        run: cargo build --release

      - name: Prepare archive
        shell: bash
        run: |
          BIN=genote
          TARGET=$(rustc -vV | grep host | cut -d' ' -f2)
          case "$TARGET" in *windows*) BIN=genote.exe ;; esac
          mkdir -p dist
          cp "target/release/$BIN" dist/
          cd dist && tar czf "../genote-$TARGET.tar.gz" "$BIN"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: genote-*.tar.gz
          body: |
            ### Changes in ${{ github.ref_name }}
            - **Cross‑platform builds** — Linux, macOS, Windows
            - **Multi‑provider + API keyring** — Ollama, OpenAI, Anthropic, Gemini, llama.cpp; keys stored in OS keychain
            - **GitHub issue prompt** — on any error, prompts `[y/N]` to open a pre‑filled issue at github.com/xmb03/Genote/issues/new (suppress with `GENOTE_NO_ISSUE=1`)
            - **Weak mode** — two‑stage generation (`--weak-mode`) for models <15B. Analyzes your style first, then writes the note. Slower but accurate style cloning
            - **Logging control** — configure verbosity per‑category: `log = true`, `log = false`, or `[log] prompt = false`
            - **NixOS / Home Manager flake** — system‑wide or per‑user declarative config
            - **crates.io** — `cargo install genote`
