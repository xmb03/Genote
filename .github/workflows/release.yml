name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build binary
        run: cargo build --release

      - name: Prepare archive
        shell: bash
        run: |
          BIN=genote
          TARGET=$(rustc -vV | grep host | cut -d' ' -f2)
          case "$TARGET" in *windows*) BIN=genote.exe ;; esac
          mkdir -p dist
          cp "target/release/$BIN" dist/
          cd dist && tar czf "../genote-$TARGET.tar.gz" "$BIN"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: genote-*.tar.gz
          body: |
            ### Changes in ${{ github.ref_name }}

            **New features**
            - **mid note size** — 45–68 lines, verified with a warning after generation (small: 25–30, big: comprehensive)
            - **Skill files** — style rules from a file via `skill` in config or `--skill`. Instead of 15 example notes, pass 1 skill file + 3 notes: same style fidelity for a fraction of the tokens
            - **Async generation** — cloud providers (OpenAI/Anthropic/Gemini) generate all topics concurrently
            - **Covered-topics context** (`use_covered_topics`) — the model builds on your existing notes as a foundation instead of re-explaining them
            - **`notes_include`** — restrict style examples to a file list; the covered-topics list still reads all `.md` files
            - **Weak-mode** — two-stage generation for models under 15B, better style cloning
            - **Nix flake + Home Manager module** for NixOS users

            **Fixes**
            - Token caps now actually sent to every provider (previously Anthropic only): Ollama `num_predict`, OpenAI `max_tokens`, llama.cpp `n_predict`, Gemini `maxOutputTokens`
            - Ollama `temperature` moved into `options` (top-level was silently ignored)
            - Windows-safe filenames: reserved device names (CON, PRN, COM1…), trailing dots/spaces, case-collision detection
            - `notes_dir` validated as a directory; real read errors instead of misleading "no .md files"
            - Deterministic example order (sorted by name)
            - Issue prompt: once per run, skipped on non-interactive stdin, bounded URL length
            - `rust-version` declared; edition 2024 / Rust 1.85+ documented

            **Packaging**
            - Automatic publish to crates.io and AUR (`genote`, `genote-bin`) on tag push

  publish-crates:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$VERSION\"$" Cargo.toml || {
            echo "Cargo.toml version does not match tag $GITHUB_REF_NAME"
            grep '^version' Cargo.toml
            exit 1
          }

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish

  publish-aur:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Update PKGBUILD for source package (genote)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/xmb03/Genote/archive/${GITHUB_REF_NAME}/genote-${VERSION}.tar.gz"
          SHA="$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD/build/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" PKGBUILD/build/PKGBUILD
          grep -E '^(pkgver|sha256sums)' PKGBUILD/build/PKGBUILD

      - name: Update PKGBUILD for binary package (genote-bin)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/xmb03/Genote/releases/download/${GITHUB_REF_NAME}/genote-x86_64-unknown-linux-gnu.tar.gz"
          SHA="$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD/bin/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" PKGBUILD/bin/PKGBUILD
          grep -E '^(pkgver|sha256sums)' PKGBUILD/bin/PKGBUILD

      - name: Deploy genote to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: genote
          pkgbuild: PKGBUILD/build/PKGBUILD
          commit_username: xmb03
          commit_email: sanekpixel101@gmail.com
          commit_message: "Update genote to ${{ github.ref_name }}"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Deploy genote-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: genote-bin
          pkgbuild: PKGBUILD/bin/PKGBUILD
          commit_username: xmb03
          commit_email: sanekpixel101@gmail.com
          commit_message: "Update genote-bin to ${{ github.ref_name }}"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
